name: Deploy frontend to S3

# Publishes the built SPA to S3 and invalidates CloudFront.
#
# The API is a separate deployment. Until it is reachable at VITE_API_BASE_URL,
# this deploys a site whose pages load but whose requests fail - see the
# deployment notes in docs/diagrams/deployment.md.

# Runs automatically once the repo secrets in docs/deployment-setup.md are set
# (learnsprint-github-actions is the scoped IAM role this assumes - ADR 0008).
# Until then this fails fast with a clear message rather than half-deploying.
on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/deploy-frontend.yml']
  workflow_dispatch:

permissions:
  id-token: write # required for the OIDC token exchange with AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Fail here rather than shipping a build that silently points at nothing.
      - name: Check the API URL is configured
        run: |
          if [ -z "${{ secrets.VITE_API_BASE_URL }}" ]; then
            echo "VITE_API_BASE_URL is not set. The build would ship with no API to call."
            exit 1
          fi

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          # Optional. Without all three the Google button is hidden in the build.
          VITE_COGNITO_DOMAIN: ${{ secrets.VITE_COGNITO_DOMAIN }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
          VITE_REDIRECT_URI: ${{ secrets.VITE_REDIRECT_URI }}
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.S3_ROLE_ARN }}
          aws-region: il-central-1

      # Hashed assets are immutable and cached hard; index.html must never be
      # cached, or browsers keep loading the old bundle after a deploy.
      - name: Sync to S3
        run: |
          aws s3 sync frontend/dist s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --cache-control "max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp frontend/dist/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/index.html"
