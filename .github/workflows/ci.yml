name: CI

# Every push on every branch, plus pull requests - so a feature branch is
# checked before it is merged, not only after it lands on main.
on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      # The suite runs against an in-memory fake for DynamoDB (tests/conftest.py),
      # so CI needs no AWS credentials and touches nothing in the real account.
      - name: Run pytest
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend typecheck, lint, tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm run test

      # The same build the deploy workflow ships, so a broken production
      # bundle fails here first instead of on the way to S3.
      - name: Production build
        working-directory: frontend
        run: npm run build
