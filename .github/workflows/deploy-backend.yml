name: Deploy backend to Lambda

# Packages the six per-feature Lambdas (ADR 0009) into one shared deployment
# zip and updates all six functions. Redeploying all six on every backend
# change is simpler and safer than tracking which feature(s) actually
# touched shared/ - see docs/deployment-setup.md.
#
# Runs automatically once the repo secrets in docs/deployment-setup.md are set
# (learnsprint-github-actions is the scoped IAM role this assumes - ADR 0008,
# widened with a `deploy-backend-lambdas` policy scoped to just these six
# function ARNs, nothing else in the account).
on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:

permissions:
  id-token: write # required for the OIDC token exchange with AWS
  contents: read

env:
  FUNCTIONS: >-
    learnsprint-auth
    learnsprint-academic-profile
    learnsprint-content-topics
    learnsprint-scheduling
    learnsprint-progress
    learnsprint-study-groups

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      # A broken backend must never reach Lambda - build and package only
      # after the same suite CI already runs on this commit passes here too.
      - name: Install dev dependencies and run tests
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          pytest -q

      # Wheels built for the Lambda runtime (manylinux2014, cp313), not
      # whatever the runner itself happens to be - see docs/deployment-setup.md.
      # Do NOT strip *.dist-info: email-validator needs it at runtime (ADR 0008).
      - name: Build the shared deployment package
        working-directory: backend
        run: |
          rm -rf build/lambda-package build/lambda-deploy.zip
          pip install --platform manylinux2014_x86_64 --python-version 3.13 \
            --implementation cp --abi cp313 --only-binary=:all: \
            --target build/lambda-package ".[lambda]"
          cp src/main.py src/lambda_handler.py build/lambda-package/
          find build/lambda-package -name "__pycache__" -type d -exec rm -rf {} +
          cd build/lambda-package && zip -r -q ../lambda-deploy.zip .

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: il-central-1

      - name: Update all six Lambda functions
        working-directory: backend
        run: |
          for function in $FUNCTIONS; do
            echo "Updating $function"
            aws lambda update-function-code \
              --function-name "$function" \
              --zip-file fileb://build/lambda-deploy.zip \
              --query LastUpdateStatus --output text
          done
          for function in $FUNCTIONS; do
            aws lambda wait function-updated --function-name "$function"
          done

      # Only content_topics reads this (FR2.7, ADR 0013) - no other function
      # needs the key in its environment. update-function-configuration
      # replaces the whole Variables map, so this reads the current one and
      # merges the key in with jq rather than clobbering DYNAMO_TABLE etc.
      # jq --arg JSON-escapes the value safely - it's never interpolated
      # into a shell string or echoed anywhere.
      - name: Sync the Anthropic key onto learnsprint-content-topics
        if: ${{ secrets.SYSTEM_ANTHROPIC_API_KEY != '' }}
        env:
          SYSTEM_ANTHROPIC_API_KEY: ${{ secrets.SYSTEM_ANTHROPIC_API_KEY }}
        run: |
          aws lambda get-function-configuration \
            --function-name learnsprint-content-topics \
            --query "Environment.Variables" --output json > current-env.json
          jq --arg key "$SYSTEM_ANTHROPIC_API_KEY" \
            '{Variables: (. + {SYSTEM_ANTHROPIC_API_KEY: $key})}' \
            current-env.json > updated-env.json
          aws lambda update-function-configuration \
            --function-name learnsprint-content-topics \
            --environment file://updated-env.json
          aws lambda wait function-updated --function-name learnsprint-content-topics

      # Google Calendar sync (FR6.2, ADR 0010) lives in the scheduling feature,
      # so only learnsprint-scheduling needs the OAuth client. Same merge-with-jq
      # pattern as above. The redirect URI is public and fixed per deployment,
      # so it is spelled out here rather than kept as a secret. Without the
      # client id secret the step is skipped and the Calendar page shows the
      # Google card as "Not available".
      - name: Sync the Google Calendar client onto learnsprint-scheduling
        if: ${{ secrets.GOOGLE_CALENDAR_CLIENT_ID != '' }}
        env:
          GOOGLE_CALENDAR_CLIENT_ID: ${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}
          GOOGLE_CALENDAR_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}
          GOOGLE_CALENDAR_REDIRECT_URI: https://d6dbklbpa5amn.cloudfront.net/calendar/google/callback
        run: |
          aws lambda get-function-configuration \
            --function-name learnsprint-scheduling \
            --query "Environment.Variables" --output json > current-env.json
          jq --arg id "$GOOGLE_CALENDAR_CLIENT_ID" \
             --arg secret "$GOOGLE_CALENDAR_CLIENT_SECRET" \
             --arg uri "$GOOGLE_CALENDAR_REDIRECT_URI" \
            '{Variables: (. + {GOOGLE_CALENDAR_CLIENT_ID: $id, GOOGLE_CALENDAR_CLIENT_SECRET: $secret, GOOGLE_CALENDAR_REDIRECT_URI: $uri})}' \
            current-env.json > updated-env.json
          aws lambda update-function-configuration \
            --function-name learnsprint-scheduling \
            --environment file://updated-env.json
          aws lambda wait function-updated --function-name learnsprint-scheduling
