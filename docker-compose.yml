services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: study_planner
      POSTGRES_PASSWORD: study_planner
      POSTGRES_DB: study_planner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study_planner"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
