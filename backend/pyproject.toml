[project]
name = "study-planner-backend"
version = "0.1.0"
description = "LearnSprint backend — FastAPI, Clean Architecture, feature-based"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "boto3>=1.35",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",  # passlib 1.7.4 can't read bcrypt's version marker on 4.1+, breaks hashing
    "python-jose[cryptography]>=3.3",
    "email-validator>=2.2",
    "pypdf>=5.1",
    "python-pptx>=1.0",
    "python-multipart>=0.0.20",
    "anthropic>=0.69",
    "httpx>=0.27",  # Google Calendar over plain REST (ADR 0010); also FastAPI's TestClient
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]
lambda = [
    "mangum>=0.19",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
